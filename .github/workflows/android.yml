# Trusted-source builds for the Ring Racers Android port.
# Every push to android-fixes-v6 (or manual dispatch) compiles both APKs from
# source in a clean runner and publishes them as workflow artifacts — no
# hand-built binaries are distributed (project rule + GPL compliance: the same
# commit that builds is the source on record).
name: Build Android APKs

on:
  push:
    branches: ["android-fixes-v6"]
  workflow_dispatch:

env:
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_HOST_TRIPLET: x64-linux

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            abi: arm64-v8a
            triplet: arm64-android
            overlay: ""
            version_code: "2406"
            version_name: "2.4-android-10"
          - name: arm32
            abi: armeabi-v7a
            triplet: arm-android
            overlay: android/triplets
            version_code: "2407"
            version_name: "2.4-android-10-arm32"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Clone vcpkg (pinned)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          cd vcpkg
          git fetch --depth 1 origin 5f96cd15fd745122cf27e0524606d6c1efc5fd07
          git checkout 5f96cd15fd745122cf27e0524606d6c1efc5fd07

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh
        working-directory: vcpkg

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: vcpkg-${{ matrix.triplet }}-5f96cd15-${{ hashFiles('vcpkg.json', 'android/triplets/**') }}

      - name: Install dependencies
        run: |
          OVERLAY=""
          if [ -n "${{ matrix.overlay }}" ]; then
            OVERLAY="--overlay-triplets=${{ github.workspace }}/${{ matrix.overlay }}"
          fi
          # shellcheck disable=SC2086
          ./vcpkg/vcpkg install curl libogg libpng libvorbis libvpx libyuv opus \
            "sdl2[vulkan]" zlib --triplet "${{ matrix.triplet }}" \
            $OVERLAY --host-triplet x64-linux

      - name: Download game assets
        run: |
          mkdir -p rr-assets/data
          cd rr-assets
          curl -L -o assets.zip "https://github.com/KartKrewDev/RingRacers/releases/download/v2.4/Dr.Robotnik.s-Ring-Racers-v2.4-Assets.zip"
          unzip -o -j assets.zip bios.pk3 gamecontrollerdb.txt -d .
          unzip -o assets.zip "data/*.pk3" -d tmpassets
          cp tmpassets/data/*.pk3 data/ && rm -rf tmpassets assets.zip
          ls data/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
          VCPKG_OVERLAY_TRIPLETS: ${{ matrix.overlay != '' && format('{0}/{1}', github.workspace, matrix.overlay) || '' }}
          RINGRACERS_ASSETS: ${{ github.workspace }}/rr-assets
          ANDROID_ABI_FILTERS: ${{ matrix.abi }}
          VERSION_CODE: ${{ matrix.version_code }}
          APP_VERSION_NAME: ${{ matrix.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingRacers-android-${{ matrix.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
